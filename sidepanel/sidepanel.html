<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker — Macro Builder</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-dot" id="status-dot"></span>
      <span class="brand-name">Clicker</span>
    </div>
    <span class="brand-sub">Macro Builder</span>
  </header>

  <section class="macro-bar">
    <select id="macro-select" class="macro-select" title="Selected macro"></select>
    <button id="btn-new" class="icon-btn" title="New macro">+</button>
    <button id="btn-rename" class="icon-btn" title="Rename macro">&#9998;</button>
    <button id="btn-delete" class="icon-btn" title="Delete macro">&#128465;</button>
  </section>

  <section class="panel" data-panel="add">
    <button class="panel-head" type="button">
      <span class="panel-title">Add step</span>
      <span class="panel-summary" id="sum-add"></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="add-buttons" id="add-buttons"></div>
    </div>
  </section>

  <main class="steps-wrap">
    <div id="empty-state" class="empty-state">
      <p>No steps yet.</p>
      <p class="muted">Hit <b>Click</b> or <b>Type</b>, then pick an element on the page.</p>
    </div>
    <div id="steps" class="steps"></div>
  </main>

  <footer class="run-bar">
    <button id="btn-run" class="run-btn">&#9654; Run</button>
    <button id="btn-stop" class="stop-btn" disabled>&#9632; Stop</button>
    <span id="run-hint" class="run-hint">Alt+Shift+R</span>
  </footer>

  <section class="panel" data-panel="toolbar">
    <button class="panel-head" type="button">
      <span class="panel-title">Toolbar</span>
      <span class="panel-summary" id="sum-toolbar">auto off · loop off · tabs on</span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <section class="panel panel-sub" data-panel="auto">
        <button class="panel-head" type="button">
          <span class="panel-title">Auto mode</span>
          <span class="panel-summary" id="sum-auto">off</span>
          <span class="chev" aria-hidden="true"></span>
        </button>
        <div class="panel-body">
          <label class="auto-row">
            <input type="checkbox" id="auto-toggle">
            <span class="auto-hint">run when a matching page loads</span>
          </label>
          <div class="auto-fields" id="auto-fields">
            <div class="field-row">
              <span class="field-label">URL</span>
              <input type="text" id="auto-pattern" class="step-input" placeholder="https://example.com/*  (blank = any page)" spellcheck="false">
            </div>
            <div class="field-row">
              <span class="field-label">Delay</span>
              <input type="number" id="auto-delay" class="step-input" min="0" step="0.1" value="0.5">
              <span class="field-label">sec</span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel panel-sub" data-panel="loop">
        <button class="panel-head" type="button">
          <span class="panel-title">Loop mode</span>
          <span class="panel-summary" id="sum-loop">off</span>
          <span class="chev" aria-hidden="true"></span>
        </button>
        <div class="panel-body">
          <label class="auto-row">
            <input type="checkbox" id="loop-toggle">
            <span class="auto-hint">repeat the steps</span>
          </label>
          <div class="auto-fields" id="loop-fields">
            <div class="field-row">
              <span class="field-label">Times</span>
              <input type="number" id="loop-count" class="step-input" min="0" step="1" value="0">
              <span class="field-label">0 = until Stop</span>
            </div>
            <div class="field-row">
              <span class="field-label">Every</span>
              <input type="number" id="loop-interval" class="step-input" min="0" step="0.1" value="1">
              <span class="field-label">sec</span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel panel-sub" data-panel="tabs">
        <button class="panel-head" type="button">
          <span class="panel-title">Follow new tabs</span>
          <span class="panel-summary" id="sum-tabs">on</span>
          <span class="chev" aria-hidden="true"></span>
        </button>
        <div class="panel-body">
          <label class="auto-row">
            <input type="checkbox" id="follow-toggle">
            <span class="auto-hint">continue on tabs a step opens</span>
          </label>
        </div>
      </section>
    </div>
  </section>

  <section class="panel" data-panel="data">
    <button class="panel-head" type="button">
      <span class="panel-title">Backup</span>
      <span class="panel-summary" id="sum-data"></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="add-buttons">
        <button class="add-btn" id="btn-export" type="button">Export</button>
        <button class="add-btn" id="btn-import" type="button">Import</button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" style="display:none">
      <div class="field-row" id="import-choice" style="display:none">
        <span class="field-label" id="import-info"></span>
        <button class="link-btn" id="btn-import-replace" type="button">replace all</button>
        <button class="link-btn" id="btn-import-merge" type="button">merge</button>
        <button class="link-btn" id="btn-import-cancel" type="button">cancel</button>
      </div>
    </div>
  </section>

  <section class="panel" data-panel="log">
    <button class="panel-head" type="button">
      <span class="panel-title">Activity</span>
      <span class="panel-summary" id="sum-log"></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="log-head">
        <span></span>
        <button id="btn-clear-log" class="link-btn" type="button">clear</button>
      </div>
      <div id="log" class="log"></div>
    </div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
